# Johnny's Brain: builds the custom image from the `custom` branch and pushes it to GHCR.
# Kept in its own file so upstream merges never touch it.
name: Johnny's Brain image

on:
  push:
    branches:
      - custom
  workflow_dispatch:

concurrency:
  group: johnnys-brain-image
  cancel-in-progress: true

env:
  # Upstream release the `custom` branch is based on. Bump when merging a new upstream tag.
  UPSTREAM_VERSION: v2.7.1
  IMAGE: ghcr.io/${{ github.repository_owner }}/vikunja

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          npm install -g corepack
          corepack enable
          pnpm install --frozen-lockfile

      - name: Frontend lint and unit tests
        working-directory: frontend
        run: |
          pnpm lint
          pnpm vitest run --dir ./src

      - name: Backend tests
        run: |
          # The Go build embeds frontend/dist; tests only need it to exist.
          mkdir -p frontend/dist && touch frontend/dist/index.html
          go install github.com/magefile/mage@latest
          mage test:feature
          go test -count=1 ./pkg/webtests/ ./pkg/migration/

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Compute version
        id: version
        run: echo "version=${UPSTREAM_VERSION}-jb.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=custom
          labels: |
            org.opencontainers.image.title=Johnny's Brain
            org.opencontainers.image.description=Custom fork of Vikunja (AGPL-3.0)
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
